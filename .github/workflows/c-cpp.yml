name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install x11, xft and xvfb
      run: sudo apt-get update && sudo apt-get install -y libx11-dev libxft-dev libxrender-dev libfontconfig-dev xvfb fonts-dejavu-core
    - name: make -j8
      run: make -j8
    - name: make check
      run: make check
